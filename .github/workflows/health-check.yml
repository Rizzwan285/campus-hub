# Keeps the Render free-tier API warm. Render spins a free service down after
# 15 minutes without inbound traffic, and the next visitor then waits up to a
# minute for a cold start.
#
# Why this loops instead of just using a */5 cron: GitHub throttles scheduled
# events hard. A plain `*/5` schedule on this repo fired at 24-65 minute
# intervals, and the `*/10` below fires only every 2-8 hours.
#
# Why each run starts its successor: a run pings for ~2 hours, but the schedule
# then took a median 1h40 (up to 6h24) to start the next one, which left the
# API free to sleep about 40% of the time. A workflow_dispatch is not
# throttled, so the hand-off is immediate and the schedule is only a safety net
# that restarts the chain if it ever breaks.
#
# GitHub-hosted runners are free and unmetered for public repositories, which
# this repo is.
name: API health check

on:
  schedule:
    # Safety net only. Whenever GitHub gets around to it, this restarts the
    # chain if a run ended without dispatching its successor.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# The hand-off step needs this; nothing else is granted.
permissions:
  actions: write

# Exactly one pinger alive at a time. A new run waits for the running one
# rather than cancelling it: every run dispatches its successor from its own
# last step, so cancelling would kill each run at the hand-off. GitHub keeps at
# most one run waiting per group, so this cannot build a backlog.
concurrency:
  group: api-health-check
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Above the loop's worst case (24 pings each timing out at 90s, plus the
    # sleeps, is ~151 minutes), so the loop always ends on its own and the
    # hand-off step still runs.
    timeout-minutes: 160
    env:
      # The API host is public (the frontend bundle embeds it), so it is a
      # plain value here rather than a secret.
      API_URL: https://campus-hub-api-nyw9.onrender.com
    steps:
      # The 5-minute pings below deliberately skip the database. This single
      # request per run (~12 a day) reports whether Postgres is reachable, and
      # is enough database activity to stop Supabase pausing the free project
      # during a break, when no students are around to generate any.
      - name: Check the database once
        run: |
          set -uo pipefail
          # --max-time 90 tolerates a cold start, which can take ~60s.
          if body=$(curl --silent --show-error --location --max-time 90 \
                         "$API_URL/api/health"); then
            echo "$body"
            case "$body" in
              *'"database":true'*) ;;
              *) echo "::warning::the API answered but reports the database as unreachable" ;;
            esac
          else
            echo "::warning::/api/health did not answer"
          fi

      - name: Ping /api/ping on a 5-minute timer
        env:
          INTERVAL_SECONDS: 300
          TOTAL_PINGS: 24
        run: |
          set -uo pipefail
          ok=0
          fail=0

          for i in $(seq 1 "$TOTAL_PINGS"); do
            if code=$(curl --silent --show-error --location \
                           --max-time 90 \
                           --output /dev/null \
                           --write-out '%{http_code}' \
                           "$API_URL/api/ping"); then
              if [ "$code" = "200" ]; then
                ok=$((ok + 1))
                echo "[$i/$TOTAL_PINGS] $(date -u +%H:%M:%SZ) ok ($code)"
              else
                fail=$((fail + 1))
                echo "[$i/$TOTAL_PINGS] $(date -u +%H:%M:%SZ) unexpected status $code"
              fi
            else
              fail=$((fail + 1))
              echo "[$i/$TOTAL_PINGS] $(date -u +%H:%M:%SZ) request failed"
            fi

            # No trailing sleep: the run should end on a ping, not on a wait.
            if [ "$i" -lt "$TOTAL_PINGS" ]; then
              sleep "$INTERVAL_SECONDS"
            fi
          done

          echo "---"
          echo "$ok ok, $fail failed"

          # A single blip is normal on a free dyno and should not turn the run
          # red. Only a total outage is worth reporting.
          if [ "$ok" -eq 0 ]; then
            echo "::error::every ping failed - the API looks down"
            exit 1
          fi

      # Runs after a failed ping step too, so an outage does not also stop the
      # pinger. Cancelling a run by hand is the way to break the chain.
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run health-check.yml \
                 --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 20
          done

          echo "::error::could not start the next run - the schedule will restart the chain"
          exit 1
