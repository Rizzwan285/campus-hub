# Development override: live reload for both the API and the frontend.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  api:
    command: ["node_modules/.bin/tsx", "watch", "src/server.ts"]
    volumes:
      # Bind only source paths — node_modules stays as built in the image.
      - ./server/src:/app/server/src
      - ./server/scripts:/app/server/scripts
      - ./server/db:/app/server/db
      - ./src/data:/app/src/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
