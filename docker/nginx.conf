server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # React Router owns the URL space: anything that is not a real file is the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite emits content-hashed filenames, so these are safe to pin forever.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached or users get a stale bundle after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
